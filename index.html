<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b4332" />
    <meta
      name="description"
      content="A distraction-free book reader: one passage at a time, with notes stored privately on your device."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Book Reader" />
    <title>Book Reader</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── CSS Variables / Themes ────────────────────────────────────────── */
      :root {
        /* Light (default) */
        --surface:         #f8f5f0;
        --surface-low:     #f2ede5;
        --surface-lowest:  #ffffff;
        --on-surface:      #1c1b18;
        --on-surface-var:  #4a4843;
        --primary:         #1b4332;
        --primary-dim:     #2d6a4f;
        --accent:          #d4af37;
        --accent-dim:      #b8991f;
        --outline:         rgba(26,28,24,0.12);
        --outline-ghost:   rgba(26,28,24,0.08);
        --on-primary:      #ffffff;
        --shimmer-a:       #ede8df;
        --shimmer-b:       #f8f5f0;
        --shadow:          rgba(26,28,24,0.08);
        --nav-bg:          rgba(248,245,240,0.88);
      }

      [data-theme="dark"] {
        --surface:         #121826;
        --surface-low:     #1a2236;
        --surface-lowest:  #202b40;
        --on-surface:      #e8e4de;
        --on-surface-var:  #9ea3b0;
        --primary:         #52b788;
        --primary-dim:     #40916c;
        --accent:          #d4af37;
        --accent-dim:      #b8991f;
        --outline:         rgba(232,228,222,0.10);
        --outline-ghost:   rgba(232,228,222,0.06);
        --on-primary:      #122010;
        --shimmer-a:       #1a2236;
        --shimmer-b:       #202b40;
        --shadow:          rgba(0,0,0,0.30);
        --nav-bg:          rgba(18,24,38,0.92);
      }

      [data-theme="sepia"] {
        --surface:         #fbf8f1;
        --surface-low:     #f5efe3;
        --surface-lowest:  #fffdf8;
        --on-surface:      #2c2416;
        --on-surface-var:  #5c4d35;
        --primary:         #6b4226;
        --primary-dim:     #8b5e3c;
        --accent:          #d4af37;
        --accent-dim:      #b8991f;
        --outline:         rgba(44,36,22,0.12);
        --outline-ghost:   rgba(44,36,22,0.07);
        --on-primary:      #ffffff;
        --shimmer-a:       #ede6d6;
        --shimmer-b:       #fbf8f1;
        --shadow:          rgba(44,36,22,0.08);
        --nav-bg:          rgba(251,248,241,0.88);
      }

      /* ── Reset & Base ──────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html {
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }

      body {
        background: var(--surface);
        color: var(--on-surface);
        font-family: 'DM Sans', sans-serif;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        transition: background 0.3s ease, color 0.3s ease;
      }

      #root {
        min-height: 100dvh;
      }

      /* ── Font size scale ───────────────────────────────────────────────── */
      [data-font-size="sm"]  { font-size: 14px; }
      [data-font-size="md"]  { font-size: 16px; }
      [data-font-size="lg"]  { font-size: 18px; }
      [data-font-size="xl"]  { font-size: 20px; }

      /* Font family toggle */
      [data-font-family="serif"] body,
      [data-font-family="serif"] .reader-body {
        font-family: 'Merriweather', Georgia, serif;
      }

      /* ── Animations ────────────────────────────────────────────────────── */
      @keyframes pageFade {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0);   }
      }

      @keyframes shimmer {
        from { background-position: -600px 0; }
        to   { background-position:  600px 0; }
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0);    }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      @keyframes toastIn {
        from { opacity: 0; transform: translateX(-50%) translateY(10px); }
        to   { opacity: 1; transform: translateX(-50%) translateY(0); }
      }

      /* ── Scrollbar ─────────────────────────────────────────────────────── */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--outline); border-radius: 4px; }

      /* ── Selection ─────────────────────────────────────────────────────── */
      ::selection {
        background: var(--primary);
        color: var(--on-primary);
      }

      /* ── Focus styles ──────────────────────────────────────────────────── */
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* ── Utility ───────────────────────────────────────────────────────── */
      textarea { resize: vertical; }
      button { cursor: pointer; }
      a { color: inherit; }

      /* ── Text reader ─────────────────────────────────────────── */
      .tr { --tr-size: calc(18.5px * var(--tr-scale, 1)); }
      .tr article {
        font-family: 'Merriweather', Georgia, serif;
        font-weight: 300;
        font-size: var(--tr-size);
        line-height: 1.8;
        color: var(--on-surface);
        max-width: 36em;
        margin: 0 auto;
        overflow-wrap: break-word;
      }
      .tr-progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200; }
      .tr-progress div { height: 100%; background: var(--accent); transition: width .15s linear; }
      .tr-tools { display: flex; justify-content: flex-end; gap: 6px; margin: -8px 0 8px; }
      .tr-tools button {
        min-width: 44px; height: 36px; border-radius: 10px; cursor: pointer;
        border: 1px solid var(--outline-ghost); background: var(--surface-lowest);
        color: var(--on-surface); font: 600 14px 'DM Sans', sans-serif;
      }
      .tr-head { text-align: center; margin: 8px 0 2em; }
      .tr-num { font: 600 11px 'DM Sans', sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-dim); }
      .tr-head h1 { font: 600 2em/1.15 'Cormorant Garamond', serif; margin: .25em 0 .1em; }
      .tr-meaning { font: italic 400 1.15em 'Cormorant Garamond', serif; color: var(--on-surface-var); }
      .tr p { margin: 0 0 1.15em; }
      .tr h2 { font: 600 1.45em/1.25 'Cormorant Garamond', serif; margin: 1.9em 0 .6em; color: var(--primary); }
      .tr h3 { font: 700 1em/1.4 'DM Sans', sans-serif; margin: 1.6em 0 .5em; }
      .tr em { font-style: italic; }
      .tr blockquote {
        margin: 1.3em 0; padding: .9em 1.1em; border-left: 3px solid var(--accent);
        background: var(--surface-low); border-radius: 0 12px 12px 0; font-weight: 400;
      }
      .tr ol { margin: 0 0 1.2em; padding-left: 1.6em; }
      .tr li { margin-bottom: .55em; padding-left: .2em; }
      .tr li::marker { color: var(--accent-dim); font-weight: 700; }
      .tr-ref { font: 500 .72em 'DM Sans', sans-serif; color: var(--on-surface-var); white-space: nowrap; letter-spacing: .02em; }
      .tr-page {
        display: block; margin: -.4em 0 .4em auto; padding: 2px 8px; border: none; border-radius: 6px;
        background: transparent; color: var(--on-surface-var); opacity: .55; cursor: pointer;
        font: 500 11px 'DM Sans', sans-serif;
      }
      .tr-page:hover { opacity: 1; background: var(--surface-low); }
      .tr-end { text-align: center; margin: 3em 0 1em; }
      .tr-end-mark { color: var(--accent); font-size: 20px; margin-bottom: 18px; }
      .tr-end button {
        padding: 14px 24px; border-radius: 40px; border: none; cursor: pointer;
        background: var(--primary); color: var(--on-primary); font: 600 15px 'DM Sans', sans-serif;
      }
      .tr-tools { align-items: center; }
      .tr-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--surface-low); border: 1px solid var(--outline-ghost); }
      .tr-tools .tr-seg button { min-width: 0; height: 30px; padding: 0 14px; border: none; background: transparent; color: var(--on-surface-var); }
      .tr-tools .tr-seg button.on { background: var(--surface-lowest); color: var(--on-surface); box-shadow: 0 1px 4px var(--shadow); }

      /* Focus mode */
      .fx-stage { min-height: 52vh; animation: pageFade .28s ease; }
      .fx-title { text-align: center; padding: 14vh 0 4vh; }
      .fx-title h1 { font: 600 2.6em/1.1 'Cormorant Garamond', serif; margin: .25em 0 .15em; color: var(--on-surface); }
      .fx-title .tr-meaning { font-size: 1.35em; }
      .fx-hint { margin-top: 2.4em; font: 400 13px 'DM Sans', sans-serif; color: var(--on-surface-var); }
      .fx-context {
        display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
        font: 600 11px 'DM Sans', sans-serif; letter-spacing: .12em; text-transform: uppercase;
        color: var(--accent-dim); margin: 18px auto 18px; max-width: 34em;
      }
      .fx-context span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .fx-count { color: var(--on-surface-var); letter-spacing: .04em; flex-shrink: 0; }
      .tr .fx-text {
        font-family: 'Merriweather', Georgia, serif; font-weight: 300; color: var(--on-surface);
        font-size: calc(var(--tr-size) * 1.08); line-height: 1.85; max-width: 34em; margin: 0 auto;
      }
      .tr .fx-text p, .tr .fx-text blockquote { margin: 0; }
      .tr .fx-text ul { padding-left: 1.4em; }
      .fx-actions { display: flex; gap: 8px; justify-content: center; margin: 28px auto 8px; max-width: 34em; }
      .fx-actions button {
        height: 44px; min-width: 48px; padding: 0 16px; border-radius: 22px; cursor: pointer;
        border: 1px solid var(--outline); background: var(--surface-lowest); color: var(--on-surface);
        font: 600 14px 'DM Sans', sans-serif;
      }
      .fx-actions button.on { color: #c0392b; border-color: rgba(192,57,43,.35); }
      .fx-actions .fx-reflect { background: var(--primary); color: var(--on-primary); border-color: var(--primary); flex: 1; max-width: 220px; }
      .fx-nav {
        position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px;
        margin: 24px -4px 0; padding: 10px 4px; background: var(--surface);
      }
      .fx-nav > button {
        width: 56px; height: 52px; border-radius: 16px; border: none; cursor: pointer; flex-shrink: 0;
        background: var(--primary); color: var(--on-primary); font-size: 22px;
      }
      .fx-nav > button:disabled { opacity: .3; cursor: default; }
      .fx-dots { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
      .fx-dots span { width: 6px; height: 6px; border-radius: 3px; background: var(--outline); }
      .fx-dots span.done { background: var(--accent); }
      .fx-dots span.cur { width: 16px; background: var(--primary); }
      .fx-done { text-align: center; padding: 10vh 0 2vh; font-family: 'DM Sans', sans-serif; }
      .fx-done h2 { font: 600 2em/1.2 'Cormorant Garamond', serif; color: var(--on-surface); margin-bottom: 8px; }
      .fx-done p { color: var(--on-surface-var); margin-bottom: 26px; }
      .fx-done-btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
      .fx-done-btns button, .rf-actions button, .rf-new {
        padding: 13px 22px; border-radius: 40px; border: none; cursor: pointer;
        background: var(--primary); color: var(--on-primary); font: 600 15px 'DM Sans', sans-serif;
      }
      .fx-done-btns button.ghost, .rf-actions button.ghost { background: transparent; color: var(--on-surface); border: 1px solid var(--outline); }

      /* Reflections */
      .rf, .rf-composer { font-family: 'DM Sans', sans-serif; max-width: 34em; margin-left: auto; margin-right: auto; }
      .rf-composer { margin-top: 18px; }
      .rf-composer textarea {
        width: 100%; box-sizing: border-box; min-height: 120px; padding: 14px 16px; border-radius: 14px; resize: vertical;
        border: 1px solid var(--outline); background: var(--surface-lowest); color: var(--on-surface);
        font: 400 16px/1.6 'Merriweather', Georgia, serif;
      }
      .rf-composer textarea:focus { outline: none; border-color: var(--primary); }
      .rf-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
      .rf-tags button {
        padding: 6px 12px; border-radius: 20px; cursor: pointer; font: 500 13px 'DM Sans', sans-serif;
        border: 1px solid var(--outline); background: transparent; color: var(--on-surface-var);
      }
      .rf-tags button.on { background: var(--accent); border-color: var(--accent); color: #1c1b18; }
      .rf-actions { display: flex; justify-content: flex-end; gap: 8px; }
      .rf-actions button:disabled { opacity: .4; cursor: default; }
      .rf-entry {
        margin-top: 12px; padding: 14px 16px; border-radius: 14px;
        background: var(--surface-lowest); border: 1px solid var(--outline-ghost); box-shadow: 0 2px 12px var(--shadow);
      }
      .rf-quote { font: italic 300 14px/1.6 'Merriweather', Georgia, serif; color: var(--on-surface-var); border-left: 2px solid var(--accent); padding-left: 10px; margin-bottom: 10px; }
      .rf-text { font: 400 15px/1.65 'Merriweather', Georgia, serif; color: var(--on-surface); white-space: pre-wrap; }
      .rf-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--on-surface-var); }
      .rf-tag { padding: 2px 9px; border-radius: 20px; background: var(--surface-low); font-weight: 600; }
      .rf-date { margin-left: auto; }
      .rf-meta button { border: none; background: none; color: var(--primary); font: 600 12px 'DM Sans', sans-serif; cursor: pointer; padding: 4px; }
      .rf-h { font: 600 11px 'DM Sans', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-dim); margin-bottom: 10px; }
      .rf-empty { color: var(--on-surface-var); font-size: 14px; line-height: 1.6; }
      .rf-chapter { display: block; margin: 18px 0 -4px; border: none; background: none; padding: 0; cursor: pointer; font: 600 13px 'Cormorant Garamond', serif; font-size: 16px; color: var(--primary); }
      .rf-legacy { margin-top: 32px; border-top: 1px solid var(--outline-ghost); padding-top: 16px; }
      .rf-legacy summary { cursor: pointer; font: 600 14px 'DM Sans', sans-serif; color: var(--on-surface-var); padding: 6px 0; }

      /* Reader dock pinned to the bottom (above the app nav on phones): actions row + arrows */
      .fx { padding-bottom: 160px; }
      .tr .pg-article { padding-bottom: 90px; }
      .tr .dock {
        position: fixed; left: 80px; right: 0; bottom: 0; z-index: 150;
        padding: 8px max(16px, calc((100% - 720px) / 2)) 10px; background: var(--surface);
        border-top: 1px solid var(--outline-ghost);
      }
      @media (max-width: 767px) { .tr .dock { left: 0; bottom: 72px; } }
      .tr .dock .fx-nav { position: static; margin: 8px 0 0; padding: 0; background: none; }
      .dk-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .dk-slot { width: 44px; display: flex; justify-content: center; }
      .dk-actions .rd-seg { flex: 0 1 220px; display: flex; }
      .dk-actions .rd-seg button { flex: 1; height: 38px; }

      /* Journal filter chips */
      .jr-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 20px; }
      .jr-chips button {
        padding: 7px 14px; border-radius: 20px; cursor: pointer; font: 600 13px 'DM Sans', sans-serif;
        border: 1px solid var(--outline); background: transparent; color: var(--on-surface-var);
      }
      .jr-chips button.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

      /* Top-bar actions */
      .rd-bar { gap: 8px; }
      .rd-title { font-size: 17px; }
      .rd-seg button { padding: 0 12px; font-size: 13px; }
      .rd-icon {
        position: relative; width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; cursor: pointer;
        border: 1px solid var(--outline-ghost); background: var(--surface-lowest); color: var(--on-surface); font-size: 18px;
      }
      .rd-icon.on { color: #e05a4a; border-color: rgba(224,90,74,.4); }
      .rd-reflect { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
      .rd-reflect.active { box-shadow: 0 0 0 3px rgba(82,183,136,.35); }
      .rd-badge {
        position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
        background: var(--accent); color: #1c1b18; font: 700 11px/18px 'DM Sans', sans-serif;
      }
      .rd-text-btn {
        height: 36px; padding: 0 14px; border-radius: 10px; cursor: pointer; border: none;
        background: var(--primary); color: var(--on-primary); font: 600 14px 'DM Sans', sans-serif;
      }

      /* Reader top bar */
      .rd-bar {
        position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 10px;
        margin: -24px -20px 18px; padding: 12px 20px; background: var(--surface);
        border-bottom: 1px solid var(--outline-ghost);
      }
      .rd-back {
        width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; cursor: pointer; font-size: 18px;
        border: 1px solid var(--outline-ghost); background: var(--surface-lowest); color: var(--on-surface);
      }
      .rd-title {
        flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font: 600 19px 'Cormorant Garamond', serif; color: var(--on-surface);
      }
      .rd-seg button { height: 34px; padding: 0 16px; border: none; border-radius: 9px; cursor: pointer;
        background: transparent; color: var(--on-surface-var); font: 600 14px 'DM Sans', sans-serif; }
      .rd-seg button.on { background: var(--primary); color: var(--on-primary); box-shadow: none; }

      /* Reflect view */
      .rf-head { text-align: center; margin: 8px 0 26px; }
      .rf-head h1 { font: 600 2.1em/1.15 'Cormorant Garamond', serif; margin: .2em 0 .1em; color: var(--on-surface); }
      .rf-head .tr-meaning { font-size: 1.2em; }
      .rf-stats { margin-top: 12px; font-size: 13px; color: var(--on-surface-var); }
      .rf-section { margin-bottom: 34px; }
      .rf-lead { font-size: 14px; line-height: 1.6; color: var(--on-surface-var); margin: -2px 0 14px; }
      .rf-empty-card {
        font-family: 'DM Sans', sans-serif; padding: 20px; border-radius: 16px; border: 1px dashed var(--outline);
        color: var(--on-surface-var); font-size: 14px; line-height: 1.6;
      }
      .rf-empty-card p { margin: 0 0 10px; }
      .rf-empty-card .rf-new { margin-top: 6px; }
      .rf-open { display: block; width: 100%; text-align: left; border: none; background: none; padding: 0; cursor: pointer; color: inherit; }
      .rf-go { display: block; margin: -4px 0 8px 12px; font: 600 12px 'DM Sans', sans-serif; color: var(--primary); }
      .rf-entry-chapter { font: 600 16px 'Cormorant Garamond', serif; color: var(--on-surface); margin-bottom: 8px; }

      /* Index: continue card */
      .ix-continue {
        display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; width: 100%; text-align: left; cursor: pointer;
        margin-bottom: 18px; padding: 16px 18px; border: none; border-radius: 16px;
        background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 24px var(--shadow);
      }
      .ix-continue-label { font: 600 11px 'DM Sans', sans-serif; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
      .ix-continue-name { font: 600 22px/1.2 'Cormorant Garamond', serif; grid-column: 1; }
      .ix-continue-meta { font: 400 13px 'DM Sans', sans-serif; opacity: .8; grid-column: 1; }
      .ix-continue-go { grid-column: 2; grid-row: 1 / span 3; align-self: center; font-size: 22px; }

      /* Library */
      .lb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; }
      .lb-card { display: flex; flex-direction: column; gap: 10px; text-align: left; background: none; border: none; cursor: pointer; padding: 0; color: inherit; min-width: 0; }
      .lb-card:hover .lb-cover { transform: translateY(-3px); box-shadow: 0 12px 30px var(--shadow); }
      .lb-cover {
        aspect-ratio: 2 / 3; width: 100%; border-radius: 6px 10px 10px 6px; padding: 14px 12px; color: #fff;
        display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
        box-shadow: 0 6px 18px var(--shadow), inset 6px 0 0 rgba(0,0,0,.18); transition: transform .2s ease, box-shadow .2s ease;
      }
      .lb-cover-title { font: 600 19px/1.15 'Cormorant Garamond', serif; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .lb-cover-author { font: 500 10px 'DM Sans', sans-serif; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
      .lb-cover-sm { width: 44px; padding: 4px; border-radius: 3px 5px 5px 3px; flex-shrink: 0; }
      .lb-cover-sm .lb-cover-title { font-size: 7px; -webkit-line-clamp: 4; }
      .lb-cover-sm .lb-cover-author { display: none; }
      .lb-meta { min-width: 0; }
      .lb-title { font: 600 16px/1.25 'Cormorant Garamond', serif; color: var(--on-surface); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .lb-author { font: 400 12px 'DM Sans', sans-serif; color: var(--on-surface-var); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .lb-continue {
        display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer;
        margin: 4px 0 22px; padding: 12px 18px 12px 12px; border: none; border-radius: 16px;

      .lb-tools { display: flex; gap: 8px; margin-bottom: 20px; }
      .lb-tools input, .lb-tools select {
        background: var(--surface-lowest); border: 1px solid var(--outline-ghost); border-radius: 12px; color: var(--on-surface);
        font: 14px 'DM Sans', sans-serif; padding: 10px 12px; outline: none; min-width: 0;
      }
      .lb-tools input { flex: 1; }
      .lb-empty pre, .lb-empty code { font-family: ui-monospace, Menlo, monospace; }
      .lb-empty pre { background: var(--surface-low); border-radius: 8px; padding: 10px 14px; margin: 8px 0 12px; font-size: 14px; }
      code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; background: var(--surface-low); padding: 1px 5px; border-radius: 4px; }

      /* Contents */
      .ix-lib-link { background: none; border: none; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 0; }
      .ix-focus { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; font: 500 12px 'DM Sans', sans-serif; color: var(--on-surface-var); }
      .ix-focus button {
        padding: 5px 12px; border-radius: 40px; border: 1px solid var(--outline-ghost); background: transparent; cursor: pointer;
        color: var(--on-surface); font: 600 12px 'DM Sans', sans-serif;
      }

      .ft-pill {
